<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostbooked — Odira Ndubuaku, Documentary Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1d14;
  --ivory:#e9e4d1;
  --ivory-dim:#a9a488;
  --gold:#93A267;
  --gold-dim:#5c6b3d;
  --burgundy:#3d3423;
  --line: rgba(233,228,209,0.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:auto;}
body{
  background:var(--ink);
  color:var(--ivory);
  font-family:'Inter', sans-serif;
  overflow-x:hidden;
}
h1,h2,h3,h4, .display{
  font-family:'Fraunces', serif;
  font-weight:500;
  letter-spacing:-0.01em;
}
a{color:inherit; text-decoration:none;}
::selection{background:var(--gold-dim); color:var(--ivory);}

/* FILM GRAIN (sitewide, restrained) */
.grain{
  position:fixed; inset:-10%; z-index:250; pointer-events:none;
  opacity:0.045; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  animation:grain-shift 1s steps(3) infinite;
}
@keyframes grain-shift{
  0%,100%{transform:translate(0,0);}
  33%{transform:translate(-1.5%,1%);}
  66%{transform:translate(1%,-1.5%);}
}
@media (prefers-reduced-motion: reduce){ .grain{animation:none;} }

/* SCROLL REVEAL (driven by GSAP ScrollTrigger) */
.reveal{ opacity:0; transform:translateY(34px); }
.reveal.is-visible{ opacity:1; transform:translateY(0); }
@media (prefers-reduced-motion: reduce){ .reveal{opacity:1 !important; transform:none !important;} }

/* CHAPTER RAIL (fixed vertical index — NYT-interactive nod) */
.chapter-rail{
  position:fixed; right:28px; top:50%; transform:translateY(-50%);
  z-index:150;
  display:flex; flex-direction:column; gap:18px;
  align-items:flex-end;
}
.chapter-rail a{
  font-size:0.7rem; letter-spacing:0.08em; color:var(--ivory-dim);
  display:flex; align-items:center; gap:10px;
  opacity:0.55; transition:opacity 0.3s ease, color 0.3s ease;
}
.chapter-rail a .num{font-family:ui-monospace, "SF Mono", monospace; font-size:0.68rem;}
.chapter-rail a .dash{width:14px; height:1px; background:var(--ivory-dim); transition:width 0.3s ease, background 0.3s ease;}
.chapter-rail a.active, .chapter-rail a:hover{opacity:1; color:var(--gold);}
.chapter-rail a.active .dash, .chapter-rail a:hover .dash{width:28px; background:var(--gold);}
.chapter-rail a .label{display:none;}
.chapter-rail a.active .label, .chapter-rail a:hover .label{display:inline;}
@media (max-width:1100px){ .chapter-rail{display:none;} }

/* NAV */
nav{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; justify-content:space-between; align-items:center;
  padding:26px 5vw;
  background:linear-gradient(to bottom, rgba(20,18,16,0.85), transparent);
  transition:transform 0.4s cubic-bezier(0.2,0.6,0.2,1);
}
nav.nav-hidden{ transform:translateY(-100%); }
.logo{ font-family:'Fraunces', serif; font-size:1.2rem; letter-spacing:0.02em; }
.logo span{color:var(--gold);}
.nav-cta{
  border:1px solid var(--gold-dim); padding:9px 20px;
  font-size:0.76rem; letter-spacing:0.06em; text-transform:uppercase;
  transition:all 0.25s;
}
.nav-cta:hover{background:var(--gold); color:var(--ink); border-color:var(--gold);}

/* REC TIMECODE (signature — bottom-left, out of the rail's way) */
.rec-timecode{
  position:fixed; bottom:22px; left:22px; z-index:150;
  display:flex; align-items:center; gap:9px;
  background:rgba(27,29,20,0.7); backdrop-filter:blur(6px);
  border:1px solid var(--line); padding:9px 14px;
  font-family:ui-monospace, "SF Mono", "Courier New", monospace;
  font-size:0.72rem; letter-spacing:0.05em; color:var(--ivory-dim);
}
.rec-timecode .dot{width:7px; height:7px; border-radius:50%; background:#a85c46; animation:recpulse 1.6s ease-in-out infinite; flex-shrink:0;}
.rec-timecode b{color:var(--ivory); font-weight:500;}
@keyframes recpulse{0%,100%{opacity:1;} 50%{opacity:0.2;}}
@media (max-width:820px){ .rec-timecode{display:none;} }
@media (prefers-reduced-motion: reduce){ .rec-timecode .dot{animation:none;} }

/* CHAPTER LABEL (shared across sections) */
.chapter-mark{
  display:flex; align-items:baseline; gap:16px; margin-bottom:22px;
}
.chapter-mark .num{
  font-family:ui-monospace, "SF Mono", monospace;
  font-size:0.85rem; color:var(--gold-dim); letter-spacing:0.05em;
}
.chapter-mark .name{
  font-size:0.78rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold);
}

/* ============ HERO ============ */
.hero{
  min-height:100vh; display:flex; flex-direction:column; justify-content:flex-end;
  padding:0 5vw 90px; position:relative; overflow:hidden;
}
.hero-video, .hero-video-fallback{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.hero-video-fallback{
  border:1px dashed var(--line); display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px; color:var(--ivory-dim); font-size:0.85rem;
  background:
    radial-gradient(ellipse 340px 220px at 12% 18%, rgba(93,107,61,0.45), transparent 70%),
    radial-gradient(ellipse 260px 300px at 85% 10%, rgba(61,52,35,0.55), transparent 70%),
    var(--ink);
}
.hero-scrim{ position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(27,29,20,0.35) 0%, rgba(27,29,20,0.55) 55%, rgba(27,29,20,0.94) 100%); }
.hero > *:not(.hero-video):not(.hero-video-fallback):not(.hero-scrim){ position:relative; z-index:2; }
.hero-eyebrow{
  font-size:0.76rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);
  margin-bottom:22px; display:flex; align-items:center; gap:14px;
}
.hero-eyebrow::before{ content:""; width:40px; height:1px; background:var(--gold-dim); display:inline-block; }
.hero h1{
  font-size:clamp(2.1rem, 5.6vw, 4.6rem); line-height:1.08; max-width:15ch; font-weight:500;
}
.hero h1 em{ font-style:italic; color:var(--gold); font-weight:400; }
.hero-meta{
  margin-top:44px; display:flex; gap:56px; font-size:0.8rem; letter-spacing:0.03em; color:var(--ivory-dim);
}
.hero-meta div{ border-left:1px solid var(--line); padding-left:18px; }
.hero-meta b{ display:block; color:var(--ivory); font-family:'Fraunces',serif; font-size:1.6rem; font-weight:400; margin-bottom:4px; }
.scroll-cue{
  position:absolute; bottom:36px; left:5vw; font-size:0.72rem; letter-spacing:0.15em; text-transform:uppercase;
  color:var(--ivory-dim); display:flex; align-items:center; gap:10px; z-index:2;
}
.scroll-cue .bar{ width:1px; height:32px; background:var(--ivory-dim); position:relative; overflow:hidden; }
.scroll-cue .bar::after{ content:""; position:absolute; top:-100%; left:0; width:100%; height:100%; background:var(--gold); animation:pour 1.8s ease-in-out infinite; }
@keyframes pour{ 0%{top:-100%;} 60%{top:100%;} 100%{top:100%;} }
@media (prefers-reduced-motion: reduce){ .scroll-cue .bar::after{animation:none;} }

/* ============ JOURNEY ============ */
.journey{ padding:60px 5vw 160px; border-top:1px solid var(--line); }
.journey-grid{ display:grid; grid-template-columns:280px 1fr; gap:80px; }
.journey-pin{ position:sticky; top:140px; align-self:start; }
.journey-pin h2{ font-size:clamp(2rem,3.6vw,3rem); line-height:1.1; margin-top:10px; max-width:9ch; }
.journey-photo{
  margin-top:36px; aspect-ratio:3/4; border:1px dashed var(--line);
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:20px; color:var(--ivory-dim); font-size:0.8rem; overflow:hidden;
}
.journey-photo img{ width:100%; height:100%; object-fit:cover; }
.journey-body p{ color:var(--ivory-dim); font-size:1.08rem; line-height:1.85; max-width:62ch; margin-bottom:60px; }
.journey-timeline{ display:flex; flex-direction:column; gap:26px; margin-bottom:90px; }
.journey-timeline .row{ display:flex; gap:26px; align-items:baseline; padding-bottom:26px; border-bottom:1px solid var(--line); }
.journey-timeline .yr{ font-family:'Fraunces',serif; color:var(--gold); min-width:64px; font-size:1.2rem; }
.journey-timeline .desc{ color:var(--ivory-dim); font-size:1rem; }
.duality-split{ display:grid; grid-template-columns:1fr 1px 1fr; gap:56px; }
.duality-divider{ background:var(--line); }
.duality-col .tag{ font-size:0.76rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; display:block; }
.duality-col h3{ font-size:1.5rem; margin-bottom:16px; line-height:1.25; }
.duality-col p{ color:var(--ivory-dim); font-size:1rem; line-height:1.75; }
@media (max-width:900px){
  .journey-grid{ grid-template-columns:1fr; gap:40px; }
  .journey-pin{ position:static; }
  .duality-split{ grid-template-columns:1fr; gap:36px; }
  .duality-divider{ display:none; }
}

/* ============ FILMS (flagship case study) ============ */
.films-chapter{ padding:80px 5vw 60px; border-top:1px solid var(--line); background:#0f0d0b; }
.films-intro{ max-width:640px; margin-bottom:70px; }
.films-intro h2{ font-size:clamp(2rem,3.6vw,3rem); line-height:1.15; margin-top:10px; }
.films-intro p{ color:var(--ivory-dim); font-size:1.05rem; line-height:1.7; margin-top:22px; max-width:58ch; }

.case-study{
  position:relative; min-height:88vh; display:flex; align-items:flex-end;
  margin-bottom:70px; border:1px solid var(--line); overflow:hidden;
}
.case-study img, .case-study video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.55) saturate(0.9); }
.case-study-content{ position:relative; z-index:2; padding:56px; width:100%; }
.case-study-tag{ font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--gold); margin-bottom:18px; display:block; }
.case-study h3{ font-size:clamp(2rem,4.6vw,4rem); line-height:1.05; max-width:14ch; }
.case-study .client{ font-style:italic; color:var(--gold); font-weight:400; }
.case-study-watch{
  margin-top:28px; display:inline-flex; align-items:center; gap:12px;
  border:1px solid var(--ivory); padding:12px 24px; font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase;
  cursor:pointer; transition:all 0.25s ease;
}
.case-study-watch:hover{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
.case-study-watch::before{ content:""; width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:8px solid currentColor; }

.case-detail-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-top:none;
  margin-bottom:120px;
}
.case-detail{ background:#0f0d0b; padding:40px 36px; }
.case-detail h4{ font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; }
.case-detail p{ color:var(--ivory-dim); font-size:0.95rem; line-height:1.7; }
@media (max-width:900px){ .case-detail-grid{ grid-template-columns:1fr; } .case-study{ min-height:70vh; } }

.filmstrip-wrap{ overflow:hidden; padding-bottom:100px; }
.filmstrip-label{ padding:0 5vw; margin-bottom:36px; font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ivory-dim); }
.filmstrip-track{ display:flex; gap:2px; padding-left:5vw; width:max-content; }
.film-card{
  position:relative; width:min(70vw, 460px); aspect-ratio:16/10; flex-shrink:0; overflow:hidden;
  cursor:pointer; background:#1c1815;
}
.film-card img, .film-card video{ width:100%; height:100%; object-fit:cover; filter:grayscale(30%) brightness(0.75); transition:transform 0.6s ease, filter 0.5s ease; }
.film-card:hover img, .film-card:hover video{ transform:scale(1.06); filter:grayscale(0%) brightness(0.9); }
.film-card-meta{ position:absolute; left:24px; bottom:22px; right:24px; }
.film-card-year{ font-size:0.72rem; letter-spacing:0.1em; color:var(--ivory-dim); margin-bottom:8px; display:block; }
.film-card h4{ font-size:1.5rem; line-height:1.2; }
.film-card .client{ font-style:italic; color:var(--gold); font-weight:400; }
.film-card .play{
  position:absolute; top:22px; right:22px; width:40px; height:40px; border-radius:50%;
  border:1px solid var(--ivory); display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(0.85); transition:all 0.25s ease;
}
.film-card .play::before{ content:""; width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:9px solid var(--ivory); margin-left:3px; }
.film-card:hover .play{ opacity:1; transform:scale(1); }

/* ============ COMMERCIAL (condensed) ============ */
.commercial{ padding:90px 5vw; border-top:1px solid var(--line); }
.commercial-intro{ max-width:560px; margin-bottom:44px; }
.commercial-intro h2{ font-size:clamp(1.7rem,2.8vw,2.3rem); line-height:1.2; margin-top:10px; }
.commercial-intro p{ color:var(--ivory-dim); font-size:0.98rem; line-height:1.6; margin-top:14px; max-width:52ch; }
.service-rows{ display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
.service-row{ background:var(--ink); padding:26px 22px; }
.service-row .idx{ font-family:ui-monospace,monospace; color:var(--gold-dim); font-size:0.78rem; display:block; margin-bottom:12px; }
.service-row h4{ font-size:1.05rem; line-height:1.25; margin-bottom:8px; }
.service-row p{ color:var(--ivory-dim); font-size:0.82rem; line-height:1.5; }
@media (max-width:820px){ .service-rows{ grid-template-columns:1fr 1fr; } }
@media (max-width:520px){ .service-rows{ grid-template-columns:1fr; } }

.reel-wrap{ border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:26px 0; overflow:hidden; white-space:nowrap; margin-top:50px; }
.reel{ display:inline-flex; animation:scroll 46s linear infinite; }
.reel span{ font-family:'Fraunces', serif; font-size:1.2rem; color:var(--ivory-dim); padding:0 40px; letter-spacing:0.01em; white-space:nowrap; }
.reel span b{ color:var(--ivory); font-weight:500; }
.reel span::after{ content:"—"; margin-left:40px; color:var(--gold-dim); }
@keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
@media (prefers-reduced-motion: reduce){ .reel{animation:none;} }

/* ============ PHOTOGRAPHY (auto-sliding marquee — Google Drive-ready) ============ */
.photography-wrap{ border-top:1px solid var(--line); background:#0f0d0b; }
.photography-intro{ padding:120px 5vw 20px; max-width:640px; }
.photography-intro h2{ font-size:clamp(2rem,3.6vw,3rem); line-height:1.15; margin-top:10px; }
.drive-status{
  display:inline-flex; align-items:center; gap:8px; margin-top:22px;
  font-size:0.76rem; letter-spacing:0.04em; color:var(--ivory-dim);
}
.drive-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold-dim); flex-shrink:0; }
.drive-status.is-live .dot{ background:var(--gold); }
.photo-marquee{
  overflow:hidden; padding:60px 0 130px;
  -webkit-mask-image:linear-gradient(90deg, transparent, black 6%, black 94%, transparent);
  mask-image:linear-gradient(90deg, transparent, black 6%, black 94%, transparent);
}
.photo-track{
  display:flex; gap:16px; width:max-content;
  animation: marquee-slide 70s linear infinite;
}
.photo-track:hover{ animation-play-state:paused; }
@keyframes marquee-slide{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.photo-item{
  position:relative; height:60vh; flex-shrink:0; overflow:hidden; border:1px solid var(--line);
  background:linear-gradient(120deg, #1c1815 25%, #23201b 37%, #1c1815 63%);
  background-size:400% 100%;
}
.photo-item.is-loading{ animation:shimmer 1.8s ease-in-out infinite; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
.photo-item img{ height:100%; width:auto; display:block; filter:grayscale(30%) brightness(0.9); transition:filter 0.5s ease; }
.photo-item:hover img{ filter:grayscale(0%) brightness(1); }
.photo-item.narrow{ width:26vw; }
.photo-item.wide{ width:44vw; }
@media (max-width:820px){
  .photo-item, .photo-item.narrow, .photo-item.wide{ width:72vw; height:42vh; }
}
@media (prefers-reduced-motion: reduce){
  .photo-track{ animation:none; }
  .photo-item.is-loading{ animation:none; }
}

/* ============ CONVERSATIONS ============ */
.conversations{ padding:140px 5vw; border-top:1px solid var(--line); }
.conversations-intro{ max-width:640px; margin-bottom:70px; }
.conversations-intro h2{ font-size:clamp(2rem,3.6vw,3rem); line-height:1.15; margin-top:10px; }
.conversations-intro p{ color:var(--ivory-dim); font-size:1.05rem; line-height:1.7; margin-top:22px; max-width:58ch; }
.episode-row{ padding:34px 0; border-bottom:1px solid var(--line); }
.episode-row h4{ font-family:'Fraunces', serif; font-size:1.6rem; line-height:1.3; max-width:46ch; }
.episode-row p{ margin-top:10px; color:var(--ivory-dim); font-size:0.95rem; }
.quote-break{ padding:150px 0 40px; text-align:center; }
.quote-break blockquote{ font-family:'Fraunces',serif; font-style:italic; font-weight:400; font-size:clamp(1.6rem, 3.6vw, 2.6rem); line-height:1.35; max-width:19ch; margin:0 auto 28px; }
.quote-break cite{ font-style:normal; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); }

/* ============ RECOGNITION ============ */
.recognition{ padding:140px 5vw; border-top:1px solid var(--line); }
.recognition-intro{ max-width:640px; margin-bottom:70px; }
.recognition-intro h2{ font-size:clamp(2rem,3.6vw,3rem); line-height:1.15; margin-top:10px; }
.stat-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:80px; }
.stat-card{ background:var(--ink); padding:40px 30px; }
.stat-card b{ display:block; font-family:'Fraunces',serif; font-size:2.2rem; font-weight:400; color:var(--gold); margin-bottom:10px; }
.stat-card span{ font-size:0.85rem; color:var(--ivory-dim); line-height:1.5; }
.press-note{ border:1px dashed var(--line); padding:40px; text-align:center; color:var(--ivory-dim); font-size:0.92rem; }
@media (max-width:820px){ .stat-grid{ grid-template-columns:1fr 1fr; } }

/* ============ VIDEO MODAL ============ */
.video-modal{ position:fixed; inset:0; z-index:300; background:rgba(10,9,7,0.92); display:none; align-items:center; justify-content:center; padding:5vw; }
.video-modal.is-open{ display:flex; }
.video-modal-inner{ width:100%; max-width:960px; aspect-ratio:16/9; background:#000; position:relative; border:1px solid var(--line); }
.video-modal-inner.is-vertical{ width:auto; height:85vh; max-height:85vh; max-width:90vw; aspect-ratio:9/16; }
.video-modal-inner iframe, .video-modal-inner video{ position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; }
.video-modal-close{ position:absolute; top:-46px; right:0; color:var(--ivory); font-size:0.85rem; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; gap:8px; }
.video-modal-close:hover{ color:var(--gold); }

/* ============ REELS SLIDER (Instagram / YouTube Shorts — Cloudinary-powered) ============ */
.reels-block{ margin-top:100px; }
.reels-label-row{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:32px; }
.reels-label{ font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ivory-dim); }
.reels-slider{
  overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg, transparent, black 4%, black 96%, transparent);
  mask-image:linear-gradient(90deg, transparent, black 4%, black 96%, transparent);
}
.reels-track{ display:flex; gap:14px; width:max-content; animation:marquee-slide 80s linear infinite; }
.reels-track:hover{ animation-play-state:paused; }
.reels-track.is-static{ animation:none; }
.reel-card{
  position:relative; width:min(46vw, 240px); aspect-ratio:9/16; flex-shrink:0; overflow:hidden;
  border:1px solid var(--line); background:#1c1815; cursor:default;
}
.reel-card.media-trigger{ cursor:pointer; }
.reel-card video, .reel-card img{ width:100%; height:100%; object-fit:cover; filter:grayscale(20%) brightness(0.85); transition:filter 0.4s ease; }
.reel-card.media-trigger:hover video, .reel-card.media-trigger:hover img{ filter:grayscale(0%) brightness(1); }
.reel-play{
  position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--ivory); display:flex; align-items:center; justify-content:center;

function initNavScrollHide(){
  const nav = document.querySelector("nav");

  let lastY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    const goingDown = y > lastY;
    nav.classList.toggle("nav-hidden", goingDown && y > 140);
    lastY = y;
  }, { passive:true });
}

  let seconds = 0;

  }, 1000);
}

function renderVideoModal(){

      <video id="video-modal-video" controls playsinline style="display:none;"></video>
    </div>
  `;
  el.addEventListener("click", (e) => { if(e.target === el) closeMediaModal(); });
  document.body.appendChild(el);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeMediaModal(); });
}

/* media = { videoId, videoSrc } — YouTube takes priority if both are set. */
function openMediaModal(media){
  const modal = document.getElementById("video-modal");
  const frame = document.getElementById("video-modal-frame");
  const video = document.getElementById("video-modal-video");
  const inner = modal ? modal.querySelector(".video-modal-inner") : null;
  if(!modal || !frame || !video) return;
  if(inner) inner.classList.toggle("is-vertical", !!media.vertical);

  if(media.videoId){
    video.pause(); video.removeAttribute("src"); video.style.display = "none";
    frame.style.display = "block";
    frame.src = `https://www.youtube.com/embed/${media.videoId}?autoplay=1&rel=0`;
  }else if(media.videoSrc){
    frame.style.display = "none"; frame.src = "";
    video.style.display = "block";
    video.src = media.videoSrc;
    video.currentTime = 0;
    video.play().catch(() => {});
  }else{
    return;
  }
  modal.classList.add("is-open");
}
function closeMediaModal(){
  const modal = document.getElementById("video-modal");
  const frame = document.getElementById("video-modal-frame");
  const video = document.getElementById("video-modal-video");
  if(!modal) return;
  modal.classList.remove("is-open");
  if(frame) frame.src = "";
  if(video){ video.pause(); video.removeAttribute("src"); video.load(); }
}

/* Wires click-to-play on any ".media-trigger" element that isn't already wired —
   safe to call repeatedly (e.g. after Drive content loads in asynchronously). */
/* Some browsers silently pause an autoplaying <video> once it's clipped out of
   the visible mask area by the marquee (or the tab loses focus, etc). This
   keeps every ".loop-preview" video resuming itself so the loop never stalls. */
function keepPreviewsPlaying(root = document){
  root.querySelectorAll("video.loop-preview:not([data-watchdog])").forEach(v => {
    v.dataset.watchdog = "1";
    v.addEventListener("pause", () => { v.play().catch(() => {}); });
    v.play().catch(() => {});
  });
  if(!keepPreviewsPlaying._observer){
    keepPreviewsPlaying._observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if(entry.isIntersecting) entry.target.play().catch(() => {}); });
    }, { threshold: 0.01 });
  }
  root.querySelectorAll("video.loop-preview").forEach(v => keepPreviewsPlaying._observer.observe(v));
}

function wireMediaTriggers(root = document){
  root.querySelectorAll(".media-trigger:not([data-wired])").forEach(el => {
    el.dataset.wired = "1";
    el.style.cursor = "pointer";
    el.addEventListener("click", () => {
      openMediaModal({ videoId: el.dataset.videoId, videoSrc: el.dataset.videoSrc, vertical: el.dataset.vertical === "1" });
    });
  });
}

/* Caps a looping preview <video> to its first N seconds (data-preview),
   so a long clip still behaves like a short, silent thumbnail loop. */
function initPreviewLoops(root = document){
  root.querySelectorAll("video[data-preview]:not([data-loop-wired])").forEach(v => {
    v.dataset.loopWired = "1";
    const sec = parseFloat(v.dataset.preview) || 8;
    v.addEventListener("timeupdate", () => { if(v.currentTime > sec) v.currentTime = 0; });
  });
}

            <div class="film-card ${filmClickable ? "media-trigger" : ""}" ${filmClickable ? `data-video-id="${film.videoId}" data-video-src="${film.videoSrc}"` : ""}>

                <h4>${film.title} <span class="client">— ${film.client}</span></h4>
              </div>
            </div>
          `;
          }).join("")}

    </section>
  `;
  wireMediaTriggers();
  initPreviewLoops();
  keepPreviewsPlaying();
}

/* Pulls images from a public Google Drive folder if configured;
   falls back to the bundled demo images otherwise. Either way,
   the track is duplicated once so the marquee loops seamlessly. */
async function loadPhotography(){
  const cfg = SITE.photography;
  const statusEl = document.getElementById("drive-status");
  const statusText = document.getElementById("drive-status-text");
  let images = cfg.demoImages;
  let live = false;

  if(cfg.driveFolderId && cfg.driveApiKey){
    try{
      const q = encodeURIComponent(`'${cfg.driveFolderId}' in parents and mimeType contains 'image/' and trashed = false`);
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=name&key=${cfg.driveApiKey}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.files && data.files.length){
        images = data.files.map(f => ({ src: `https://drive.google.com/thumbnail?id=${f.id}&sz=w1600`, alt: f.name, size: "" }));
        live = true;
      }
    }catch(err){
      console.warn("Mostbooked: could not load the Google Drive gallery, showing demo images.", err);
    }
  }

  const track = document.getElementById("photo-track");
  if(track){
    const doubled = images.concat(images);
    track.innerHTML = doubled.map(p => `
      <div class="photo-item ${p.size || ""} is-loading">
        <img src="${p.src}" alt="${p.alt}" loading="lazy" onload="this.parentElement.classList.remove('is-loading')">
      </div>
    `).join("");
  }

  if(statusEl && statusText){
    statusEl.classList.toggle("is-live", live);
    statusText.textContent = live
      ? "Synced automatically from Google Drive"
      : "Showing demo images — connect Google Drive in SITE.photography to sync automatically";
  }

  if(typeof ScrollTrigger !== "undefined") ScrollTrigger.refresh();
}

/* Takes the exact URL Cloudinary gives you for a video and splits it into
   { cloudName, idPath } so we can rebuild preview/poster/full variants of it.
   Returns null if it's not a recognizable Cloudinary video URL. */
function parseCloudinaryUrl(url){
  const m = (url || "").match(/^https:\/\/res\.cloudinary\.com\/([^/]+)\/video\/upload\/(.+)\.[a-zA-Z0-9]+$/);
  return m ? { cloudName: m[1], idPath: m[2] } : null;
}

/* Builds each reel card's preview/full/poster URLs straight from the raw
   Cloudinary URL pasted into SITE.reels.items — no manual trimming or
   separate preview file required. Falls back to a placeholder if nothing's added yet. */
function loadReels(){
  const cfg = SITE.reels;
  const statusEl = document.getElementById("reels-drive-status");
  const statusText = document.getElementById("reels-drive-status-text");
  const items = cfg.items || [];
  const sec = cfg.previewSeconds || 6;

  const track = document.getElementById("reels-track");
  if(track){
    if(items.length === 0){
      track.classList.add("is-static");
      track.innerHTML = `<div class="reel-placeholder">[ Paste Cloudinary video URLs into SITE.reels.items to populate this slider ]</div>`;
    }else{
      track.classList.remove("is-static");
      const cards = items.map(r => {
        const parsed = parseCloudinaryUrl(r.src);
        const base = parsed ? `https://res.cloudinary.com/${parsed.cloudName}/video/upload` : null;
        const preview = parsed ? `${base}/so_0,eo_${sec},q_auto,f_mp4/${parsed.idPath}.mp4` : r.src;
        const full = parsed ? `${base}/q_auto/${parsed.idPath}.mp4` : r.src;
        const poster = parsed ? `${base}/so_0/${parsed.idPath}.jpg` : "";
        return `
        <div class="reel-card media-trigger" data-video-id="" data-video-src="${full}" data-vertical="1">
          <video class="loop-preview" autoplay muted loop playsinline preload="metadata" ${poster ? `poster="${poster}"` : ""}>
            <source src="${preview}" type="video/mp4">
          </video>
          ${r.platform ? `<span class="reel-badge">${r.platform}</span>` : ""}
          <div class="reel-play"></div>
        </div>`;
      });
      const doubled = items.length > 2 ? cards.concat(cards) : cards;
      track.innerHTML = doubled.join("");
    }
  }

  if(statusEl && statusText){
    statusEl.classList.toggle("is-live", items.length > 0);
    statusText.textContent = items.length
      ? `Showing ${items.length} clip${items.length === 1 ? "" : "s"}`
      : "Nothing added yet";
  }

  wireMediaTriggers();
  keepPreviewsPlaying();
  if(typeof ScrollTrigger !== "undefined") ScrollTrigger.refresh();
}

/* =====================================================
   MOTION — Lenis smooth scroll + GSAP ScrollTrigger
   ===================================================== */
function initMotion(){
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if(reduced || typeof gsap === "undefined"){
    document.querySelectorAll(".reveal").forEach(el => el.classList.add("is-visible"));
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  if(typeof Lenis !== "undefined"){
    const lenis = new Lenis({ duration: 1.15, smoothWheel: true });
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);
  }

  // Reveal on scroll
  gsap.utils.toArray(".reveal").forEach((el) => {
    gsap.fromTo(el, { opacity:0, y:34 }, {
      opacity:1, y:0, duration:0.9, ease:"power2.out",
      scrollTrigger:{ trigger: el, start:"top 88%" }
    });
  });

  // Hero video subtle parallax
  gsap.to(".hero-video, .hero-video-fallback", {
    scale:1.12, ease:"none",
    scrollTrigger:{ trigger:"#hero", start:"top top", end:"bottom top", scrub:true }
  });

  // Chapter rail active state
  const railLinks = document.querySelectorAll("[data-rail]");
  document.querySelectorAll("[data-rail-target]").forEach((sec) => {
    ScrollTrigger.create({
      trigger: sec, start:"top center", end:"bottom center",
      onEnter: () => setActiveRail(sec.id),
      onEnterBack: () => setActiveRail(sec.id)
    });
  });
  function setActiveRail(id){
    railLinks.forEach(l => l.classList.toggle("active", l.dataset.rail === id));
  }

  ScrollTrigger.refresh();
}
