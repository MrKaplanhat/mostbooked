<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostbooked — Odira Ndubuaku, Documentary Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1d14;
  --ivory:#e9e4d1;
  --ivory-dim:#a9a488;
  --gold:#93A267;
  --gold-dim:#5c6b3d;
  --burgundy:#3d3423;
  --line: rgba(233,228,209,0.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--ink);
  color:var(--ivory);
  font-family:'Inter', sans-serif;
  overflow-x:hidden;
}
h1,h2,h3, .display{
  font-family:'Fraunces', serif;
  font-weight:500;
  letter-spacing:-0.01em;
}
a{color:inherit; text-decoration:none;}

/* SCROLL REVEAL */
.reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity 0.7s cubic-bezier(0.2,0.6,0.2,1), transform 0.7s cubic-bezier(0.2,0.6,0.2,1);
}
.reveal.is-visible{
  opacity:1;
  transform:translateY(0);
}
@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1; transform:none; transition:none;}
}

/* NAV */
nav{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; justify-content:space-between; align-items:center;
  padding:22px 5vw;
  background:linear-gradient(to bottom, rgba(20,18,16,0.9), transparent);
  transition:transform 0.4s cubic-bezier(0.2,0.6,0.2,1);
}
nav.nav-hidden{
  transform:translateY(-100%);
}
.logo{
  font-family:'Fraunces', serif;
  font-size:1.15rem;
  letter-spacing:0.02em;
}
.logo span{color:var(--gold);}
.nav-links{display:flex; gap:32px; font-size:0.82rem; letter-spacing:0.04em; text-transform:uppercase;}
.nav-links a{opacity:0.75; transition:opacity 0.25s;}
.nav-links a:hover, .nav-links a.active{opacity:1; color:var(--gold);}
.nav-cta{
  border:1px solid var(--gold-dim);
  padding:9px 18px;
  font-size:0.78rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
  transition:all 0.25s;
}
.nav-cta:hover{background:var(--gold); color:var(--ink); border-color:var(--gold);}

/* HERO (homepage) */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 5vw;
  position:relative;
  background:
    radial-gradient(ellipse 340px 220px at 12% 18%, rgba(93,107,61,0.55), transparent 70%),
    radial-gradient(ellipse 260px 300px at 85% 10%, rgba(61,52,35,0.6), transparent 70%),
    radial-gradient(ellipse 400px 260px at 70% 75%, rgba(147,162,103,0.28), transparent 65%),
    radial-gradient(ellipse 240px 200px at 25% 85%, rgba(61,52,35,0.5), transparent 70%),
    var(--ink);
}
.hero-eyebrow{
  font-size:0.78rem;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:28px;
  display:flex; align-items:center; gap:14px;
}
.hero-eyebrow::before{
  content:"";
  width:36px; height:1px;
  background:var(--gold-dim);
  display:inline-block;
}
.hero h1{
  font-size:clamp(2.4rem, 6vw, 5.2rem);
  line-height:1.02;
  max-width:15ch;
}
.hero h1 em{
  font-style:italic;
  color:var(--gold);
  font-weight:400;
}
.hero-sub{
  margin-top:28px;
  max-width:52ch;
  font-size:1.05rem;
  line-height:1.6;
  color:var(--ivory-dim);
}
.hero-video{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:0;
}
.hero-video-fallback{
  position:absolute; inset:0;
  border:1px dashed var(--line);
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px;
  color:var(--ivory-dim); font-size:0.85rem;
  z-index:0;
}
.hero-scrim{
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(180deg, rgba(27,29,20,0.55) 0%, rgba(27,29,20,0.72) 55%, rgba(27,29,20,0.92) 100%);
}
.hero > *:not(.hero-video):not(.hero-video-fallback):not(.hero-scrim){position:relative; z-index:2;}
.hero-meta{
  margin-top:56px;
  display:flex;
  gap:48px;
  font-size:0.8rem;
  letter-spacing:0.03em;
  color:var(--ivory-dim);
}
.hero-meta div{border-left:1px solid var(--line); padding-left:16px;}
.hero-meta b{display:block; color:var(--ivory); font-family:'Fraunces',serif; font-size:1.3rem; font-weight:400; margin-bottom:2px;}

.scroll-cue{
  position:absolute; bottom:36px; left:5vw;
  font-size:0.72rem; letter-spacing:0.15em; text-transform:uppercase;
  color:var(--ivory-dim);
  display:flex; align-items:center; gap:10px;
}
.scroll-cue .bar{
  width:1px; height:32px; background:var(--ivory-dim);
  position:relative; overflow:hidden;
}
.scroll-cue .bar::after{
  content:""; position:absolute; top:-100%; left:0; width:100%; height:100%;
  background:var(--gold);
  animation:pour 1.8s ease-in-out infinite;
}
@keyframes pour{
  0%{top:-100%;} 60%{top:100%;} 100%{top:100%;}
}

/* PAGE HERO (inner pages, shorter) */
.page-hero{
  min-height:56vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:140px 5vw 60px;
  background:
    radial-gradient(ellipse 300px 200px at 15% 20%, rgba(93,107,61,0.5), transparent 70%),
    radial-gradient(ellipse 220px 260px at 88% 30%, rgba(61,52,35,0.55), transparent 70%),
    var(--ink);
  border-bottom:1px solid var(--line);
}
.page-hero .eyebrow{
  font-size:0.78rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin-bottom:20px; display:block;
}
.page-hero h1{
  font-size:clamp(2rem, 4.5vw, 3.4rem);
  line-height:1.12;
  max-width:20ch;
}
.page-hero .intro{
  margin-top:24px;
  max-width:60ch;
  font-size:1.05rem;
  line-height:1.65;
  color:var(--ivory-dim);
}

/* CREDITS REEL */
.reel-wrap{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:26px 0;
  overflow:hidden;
  white-space:nowrap;
}
.reel{
  display:inline-flex;
  animation:scroll 46s linear infinite;
}
.reel span{
  font-family:'Fraunces', serif;
  font-size:1.1rem;
  color:var(--ivory-dim);
  padding:0 36px;
  letter-spacing:0.01em;
  white-space:nowrap;
}
.reel span b{color:var(--ivory); font-weight:500;}
.reel span::after{content:"—"; margin-left:36px; color:var(--gold-dim);}
@keyframes scroll{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* CHAPTERS / PATH SPLIT */
.chapters{
  padding:120px 5vw 100px;
}
.section-head{
  max-width:640px;
  margin-bottom:64px;
}
.section-head .eyebrow{
  font-size:0.78rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin-bottom:18px; display:block;
}
.section-head h2{
  font-size:clamp(1.8rem, 3.4vw, 2.8rem);
  line-height:1.15;
}
.chapter-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
}
.chapter{
  background:var(--ink);
  padding:48px 40px;
  position:relative;
  transition:background 0.35s ease, transform 0.35s cubic-bezier(0.2,0.6,0.2,1);
  cursor:pointer;
  min-height:280px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.chapter:hover{background:#1c1815; transform:translateY(-4px);}
.chapter-num{
  font-family:'Fraunces', serif;
  font-size:0.85rem;
  color:var(--gold-dim);
  letter-spacing:0.05em;
}
.chapter h3{
  font-size:1.7rem;
  margin-top:20px;
  line-height:1.2;
}
.chapter p{
  margin-top:14px;
  color:var(--ivory-dim);
  font-size:0.95rem;
  line-height:1.55;
  max-width:38ch;
}
.chapter-arrow{
  margin-top:28px;
  font-size:0.8rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--gold);
  display:flex; align-items:center; gap:8px;
  transition:gap 0.25s;
}
.chapter:hover .chapter-arrow{gap:14px;}

/* HERO VIEWFINDER (signature detail — camera framing corners) */
.viewfinder{position:absolute; inset:26px; pointer-events:none; opacity:0.55;}
.viewfinder i{position:absolute; width:22px; height:22px; font-style:normal;}
.viewfinder i:nth-child(1){top:0; left:0; border-top:1px solid var(--gold-dim); border-left:1px solid var(--gold-dim);}
.viewfinder i:nth-child(2){top:0; right:0; border-top:1px solid var(--gold-dim); border-right:1px solid var(--gold-dim);}
.viewfinder i:nth-child(3){bottom:0; left:0; border-bottom:1px solid var(--gold-dim); border-left:1px solid var(--gold-dim);}
.viewfinder i:nth-child(4){bottom:0; right:0; border-bottom:1px solid var(--gold-dim); border-right:1px solid var(--gold-dim);}
@media (max-width:820px){.viewfinder{display:none;}}

/* REC TIMECODE (signature — fixed, sitewide, injected via renderNav) */
.rec-timecode{
  position:fixed; bottom:22px; right:22px; z-index:90;
  display:flex; align-items:center; gap:9px;
  background:rgba(27,29,20,0.72);
  backdrop-filter:blur(6px);
  border:1px solid var(--line);
  padding:9px 14px;
  font-family: ui-monospace, "SF Mono", "Courier New", monospace;
  font-size:0.72rem;
  letter-spacing:0.05em;
  color:var(--ivory-dim);
}
.rec-timecode .dot{width:7px; height:7px; border-radius:50%; background:#a85c46; animation:recpulse 1.6s ease-in-out infinite; flex-shrink:0;}
.rec-timecode b{color:var(--ivory); font-weight:500;}
@keyframes recpulse{0%,100%{opacity:1;} 50%{opacity:0.2;}}
@media (max-width:820px){.rec-timecode{display:none;}}
@media (prefers-reduced-motion: reduce){.rec-timecode .dot{animation:none;}}

/* DUALITY SPLIT (The Eye / The Studio) */
.duality{
  padding:110px 5vw 30px;
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  gap:56px;
}
.duality-divider{background:var(--line);}
.duality-col .tag{font-size:0.78rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; display:block;}
.duality-col h3{font-family:'Fraunces',serif; font-size:1.65rem; margin-bottom:18px; line-height:1.25;}
.duality-col p{color:var(--ivory-dim); font-size:1rem; line-height:1.75; max-width:46ch;}
@media (max-width:820px){
  .duality{grid-template-columns:1fr; gap:40px; padding-top:70px;}
  .duality-divider{display:none;}
}

/* CONTENT PILLARS */
.pillars{padding:110px 5vw 100px; background:#0f0d0b; border-top:1px solid var(--line);}
.pillars-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:56px;}
.pillar-card{background:#0f0d0b; padding:36px 26px; transition:background 0.3s ease;}
.pillar-card:hover{background:#1c1815;}
.pillar-card h4{font-family:'Fraunces',serif; font-size:1.15rem; color:var(--gold); margin-bottom:12px; line-height:1.3;}
.pillar-card p{color:var(--ivory-dim); font-size:0.88rem; line-height:1.6;}
@media (max-width:820px){.pillars-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.pillars-grid{grid-template-columns:1fr;}}

/* QUOTE BREAK */
.quote-break{padding:150px 5vw; text-align:center;}
.quote-break blockquote{
  font-family:'Fraunces',serif; font-style:italic; font-weight:400;
  font-size:clamp(1.6rem, 3.6vw, 2.6rem); line-height:1.35;
  max-width:19ch; margin:0 auto 28px;
}
.quote-break cite{font-style:normal; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold);}

/* SERVICE LIST (inner pages) */
.services{
  padding:100px 5vw 120px;
}
.service-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
}
.service-card{
  background:var(--ink);
  padding:44px 38px;
  transition:transform 0.35s cubic-bezier(0.2,0.6,0.2,1), background 0.35s ease;
}
.service-card:hover{
  background:#1c1815;
  transform:translateY(-4px);
}
.service-card h3{
  font-size:1.4rem;
  color:var(--gold);
  margin-bottom:14px;
}
.service-card p{
  color:var(--ivory-dim);
  font-size:0.95rem;
  line-height:1.6;
}

/* ABOUT PAGE */
.about-page{
  padding:20px 5vw 120px;
  display:grid;
  grid-template-columns:0.9fr 1.1fr;
  gap:64px;
  align-items:start;
}
.about-photo{
  aspect-ratio:4/5;
  background:#1c1815;
  border:1px dashed var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  color:var(--ivory-dim);
  font-size:0.85rem;
  border-radius:4px;
  position:sticky;
  top:120px;
}
.about-copy p{
  color:var(--ivory-dim);
  font-size:1.02rem;
  line-height:1.8;
  margin-bottom:24px;
  max-width:62ch;
}
.about-copy p:first-child{
  color:var(--ivory);
  font-size:1.15rem;
}

/* EPISODE LIST (podcast page) */
.episode-list{
  padding:0 5vw 120px;
}
.episode-row{
  padding:32px 0;
  border-bottom:1px solid var(--line);
}
.episode-row h3{
  font-family:'Fraunces', serif;
  font-size:1.5rem;
  line-height:1.3;
  max-width:44ch;
}
.episode-row p{
  margin-top:10px;
  color:var(--ivory-dim);
  font-size:0.95rem;
}

/* WORK / FILMS */
.films{
  padding:100px 5vw 120px;
  background:#0f0d0b;
  border-top:1px solid var(--line);
}
.film-list{
  display:flex;
  flex-direction:column;
}
.film-row{
  display:grid;
  grid-template-columns:80px 1fr auto;
  align-items:center;
  gap:24px;
  padding:28px 0;
  border-bottom:1px solid var(--line);
  transition:padding-left 0.3s ease;
}
.film-row:hover{padding-left:12px; background:rgba(147,162,103,0.03);}
.film-row:hover .film-title{color:var(--gold);}
.film-row:hover .film-title .client{color:var(--ivory);}
.film-year{color:var(--ivory-dim); font-size:0.85rem;}
.film-title{font-family:'Fraunces', serif; font-size:1.4rem; transition:color 0.3s ease;}
.film-title-wrap{display:flex; align-items:center; gap:16px;}
.film-title .client{color:var(--gold); font-style:italic; font-weight:400;}
.film-tag{
  font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim);
  border:1px solid var(--line); padding:6px 12px; white-space:nowrap;
}
.film-row.has-video{cursor:pointer;}
.film-play{
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--gold-dim);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(0.85);
  transition:opacity 0.25s ease, transform 0.25s ease, background 0.25s ease;
  flex-shrink:0;
}
.film-play::before{
  content:"";
  width:0; height:0;
  border-top:6px solid transparent; border-bottom:6px solid transparent;
  border-left:9px solid var(--gold);
  margin-left:3px;
}
.film-row.has-video:hover .film-play{opacity:1; transform:scale(1);}
.film-row.has-video:hover{background:rgba(147,162,103,0.05);}

/* VIDEO MODAL */
.video-modal{
  position:fixed; inset:0; z-index:300;
  background:rgba(10,9,7,0.92);
  display:none;
  align-items:center; justify-content:center;
  padding:5vw;
}
.video-modal.is-open{display:flex;}
.video-modal-inner{
  width:100%; max-width:960px;
  aspect-ratio:16/9;
  background:#000;
  position:relative;
  border:1px solid var(--line);
}
.video-modal-inner iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0;
}
.video-modal-close{
  position:absolute; top:-46px; right:0;
  color:var(--ivory); font-size:0.85rem; letter-spacing:0.05em; text-transform:uppercase;
  cursor:pointer; display:flex; align-items:center; gap:8px;
}
.video-modal-close:hover{color:var(--gold);}

/* IMAGE GALLERY */
.gallery{padding:100px 5vw 110px; border-top:1px solid var(--line);}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  grid-auto-rows:170px;
  gap:6px;
  margin-top:56px;
}
.gallery-item{
  position:relative; overflow:hidden; background:#0f0d0b;
}
.gallery-item img{
  width:100%; height:100%; object-fit:cover;
  filter:grayscale(35%) brightness(0.88);
  transform:scale(1.02);
  transition:transform 0.6s cubic-bezier(0.2,0.6,0.2,1), filter 0.5s ease;
}
.gallery-item:hover img{transform:scale(1.08); filter:grayscale(0%) brightness(1);}
.gallery-item::after{
  content:""; position:absolute; inset:0;
  box-shadow:inset 0 0 0 1px var(--line);
  pointer-events:none;
}
.gallery-item.tall{grid-row:span 2;}
.gallery-item.wide{grid-column:span 2;}
@media (max-width:820px){
  .gallery-grid{grid-template-columns:repeat(2, 1fr); grid-auto-rows:140px;}
  .gallery-item.wide{grid-column:span 2;}
}


/* ABOUT STRIP */
.about{
  padding:120px 5vw;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  border-top:1px solid var(--line);
}
.about h2{font-size:clamp(1.8rem,3vw,2.4rem); line-height:1.2; max-width:14ch;}
.about-timeline{display:flex; flex-direction:column; gap:22px;}
.about-timeline .row{display:flex; gap:20px; align-items:baseline;}
.about-timeline .yr{font-family:'Fraunces',serif; color:var(--gold); min-width:52px; font-size:1.1rem;}
.about-timeline .desc{color:var(--ivory-dim); font-size:0.95rem;}
.about-body p{color:var(--ivory-dim); line-height:1.7; font-size:1rem; margin-top:20px;}

/* FOOTER CTA */
footer{
  padding:120px 5vw 60px;
  background:#0f0d0b;
  border-top:1px solid var(--line);
  text-align:center;
}
footer h2{
  font-size:clamp(2rem, 5vw, 3.5rem);
  max-width:16ch;
  margin:0 auto 40px;
  line-height:1.1;
}
.footer-cta{
  display:inline-flex;
  gap:16px;
  padding:16px 34px;
  background:var(--gold);
  color:var(--ink);
  font-size:0.9rem;
  letter-spacing:0.04em;
  text-transform:uppercase;
  font-weight:600;
  transition:transform 0.25s ease;
  border:none;
  cursor:pointer;
}
.footer-cta:hover{transform:translateY(-2px);}
.footer-bottom{
  margin-top:100px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:0.78rem; color:var(--ivory-dim); letter-spacing:0.03em;
  border-top:1px solid var(--line); padding-top:28px;
  flex-wrap:wrap; gap:16px;
}

@media (max-width:820px){
  .chapter-grid, .service-grid{grid-template-columns:1fr;}
  .about, .about-page{grid-template-columns:1fr; gap:48px;}
  .about-photo{position:static; aspect-ratio:16/10;}
  .film-row{grid-template-columns:1fr; gap:8px;}
  .hero-meta{flex-wrap:wrap; gap:28px;}
  .nav-links{display:none;}
  .film-play{display:none;}
}

@media (prefers-reduced-motion: reduce){
  .reel{animation:none;}
  .scroll-cue .bar::after{animation:none;}
}

</style>
</head>
<body>
<div id="nav-slot"></div>
<div id="hero-slot"></div>
<div id="duality-slot"></div>
<div id="reel-slot"></div>
<div id="chapters-slot"></div>
<div id="gallery-slot"></div>
<div id="pillars-slot"></div>
<div id="films-slot"></div>
<div id="quote-slot"></div>
<div id="about-slot"></div>
<div id="footer-slot"></div>
<script>
/* =====================================================
   MOSTBOOKED — SITE CONTENT
   Edit anything in this file to update the website.
   Do NOT remove commas, quotes, or curly braces {}.
   Just change the text between the quotes " "
   ===================================================== */

const SITE = {

  // ---------- BRAND ----------
  brand: {
    name: "MOSTBOOKED",
    tagline: "Documentary Studio · Founded by Odira Ndubuaku",

function renderNav(activePage){
  const links = [
    { href: "index.html", label: "Home" },
    { href: "films.html", label: "Films" },
    { href: "production.html", label: "Production" },
    { href: "youtube.html", label: "YouTube" },
    { href: "podcast.html", label: "Podcast" },
    { href: "about.html", label: "About" }
  ];
  const linksHtml = links
    .filter(l => l.href !== "index.html")
    .map(l => `<a href="${l.href}" class="${activePage===l.href ? 'active':''}">${l.label}</a>`)
    .join("");

  document.getElementById("nav-slot").innerHTML = `
    <nav>
      <a href="index.html" class="logo">${SITE.brand.name.slice(0,4)}<span>${SITE.brand.name.slice(4)}</span></a>
      <div class="nav-links">${linksHtml}</div>
      <a href="index.html#footer" class="nav-cta">Book a project</a>
    </nav>
  `;

  initNavScrollHide();
  renderRecTimer();
  renderVideoModal();
}

/* Sitewide video lightbox — used by clickable film rows on any page. */
function renderVideoModal(){
  if(document.querySelector(".video-modal")) return;
  const el = document.createElement("div");
  el.className = "video-modal";
  el.id = "video-modal";
  el.innerHTML = `
    <div class="video-modal-inner">
      <div class="video-modal-close" onclick="closeVideoModal()">Close ✕</div>
      <iframe id="video-modal-frame" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  `;
  el.addEventListener("click", (e) => { if(e.target === el) closeVideoModal(); });
  document.body.appendChild(el);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeVideoModal(); });
}
function openVideoModal(videoId){
  if(!videoId) return;
  const modal = document.getElementById("video-modal");
  const frame = document.getElementById("video-modal-frame");
  if(!modal || !frame) return;
  frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
  modal.classList.add("is-open");
}
function closeVideoModal(){
  const modal = document.getElementById("video-modal");
  const frame = document.getElementById("video-modal-frame");
  if(!modal || !frame) return;
  modal.classList.remove("is-open");
  frame.src = "";
}

/* Sitewide REC timecode — a small nod to the cinematographer's own viewfinder.
   Runs on every page since every page calls renderNav(). */
function renderRecTimer(){
  if(document.querySelector(".rec-timecode")) return;
  const el = document.createElement("div");
  el.className = "rec-timecode";
  el.innerHTML = `<span class="dot"></span>REC <b id="rec-clock">00:00</b>`;
  document.body.appendChild(el);
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let seconds = 0;
  const clock = el.querySelector("#rec-clock");
  setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    clock.textContent = `${m}:${s}`;
  }, 1000);
}

/* Nav hides on scroll-down, reappears on scroll-up (past 140px) */
function initNavScrollHide(){
  const nav = document.querySelector("nav");
  if(!nav) return;
  let lastY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    const goingDown = y > lastY;
    if(goingDown && y > 140){
      nav.classList.add("nav-hidden");
    } else {
      nav.classList.remove("nav-hidden");
    }
    lastY = y;
  }, { passive: true });
}

/* Fades in any .reveal element as it scrolls into view.
   Call this once, after all page content has been rendered. */
function initScrollReveal(){
  const els = document.querySelectorAll(".reveal");
  if(!els.length) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  els.forEach(el => observer.observe(el));
}
